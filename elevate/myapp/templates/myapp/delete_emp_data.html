<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Employee Data</title>
</head>
<style>
    table {
        border: 5px outset;
        border-radius: 10px;
        border-spacing: 10px;
        padding: 20px;
        margin-left: auto;
        margin-right: auto;
    }
    th,td {
        padding: 5px;
        border: 1px solid;
    }
</style>
<body>
    <form action="" method="POST">
        {% csrf_token %}
        <h1 style="text-align:center">Delete Employee Data</h1>
        <table style="text-align:center; margin: 0px auto;">
            <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Name</th>
                    <th>CNIC</th>
                    <th>OFFICE</th>
                </tr>
            </thead>
            <tbody>
                    <tr>
                        <td>{{ emp_data.emp_id }}</td>
                        <td>{{ emp_data.emp_name }}</td>
                        <td>{{ emp_data.emp_cnic }}</td>
                        <td>{{ emp_data.office }}</td>
                    </tr>
                    <tr>
                        <td style="border: none; text-align: left;"><button type="submit" class="btn btn-success"><a href="{% url 'show_emp_data' %}" style="text-decoration: none; color:black;">Back</a></button></td>
                        <td colspan="2" style="text-align:center; border:none;"><input type="submit" class="btn btn-success" value="Confirm"></td>
                    </tr>
            </tbody>
        </table>
    </form>
</body>

</html>
