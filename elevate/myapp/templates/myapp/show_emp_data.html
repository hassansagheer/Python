<!-- pwd_emp_template.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Employee Data</title>
</head>
<style>
    table {
        border: 5px outset;
        border-radius: 10px;
        border-spacing: 10px;
        padding: 20px;
        margin-left: auto;
        margin-right: auto;
    }
    th,td {
        padding: 5px;
        border: 1px solid;
    }
</style>
<body>
    <h1 style="text-align:center">Show Employee Data</h1>
    <table style="text-align:center; margin: 0px auto;">
        <thead>
            <tr>
                <th>Employee ID</th>
                <th>Name</th>
                <th>CNIC</th>
                <th>OFFICE</th>
            </tr>
        </thead>
        <tbody>
            {% for emp in emp_data.all %}
                <tr>
                    <td>{{ emp.emp_id }}</td>
                    <td>{{ emp.emp_name }}</td>
                    <td>{{ emp.emp_cnic }}</td>
                    <td>{{ emp.office }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
